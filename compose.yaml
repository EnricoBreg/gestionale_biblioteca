# Use postgres/example user/password credentials

services:
  db:
    image: docker.io/library/postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", ${DB_USERNAME}]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: 
