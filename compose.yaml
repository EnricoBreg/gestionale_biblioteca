# Use postgres/example user/password credentials

services:
  db:
    # Versione di postgresql fissata alla 17.9 per evitare che pg_dump crei dei vincoli indesiderati a database. 
    # Ricordarsi di scaricare la versione corretta del client: postgresql17
    image: docker.io/library/postgres:17.9
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: 
